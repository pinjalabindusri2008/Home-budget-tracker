
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Transaction | Home Budget Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1 class="page-title">Add Income / Expense</h1>

    <nav class="navbar">
        <a href="{{ url_for('home') }}">Dashboard</a>
        <a href="{{ url_for('add_transaction') }}">Add Transaction</a>
        <a href="{{ url_for('analysis') }}">Expense Analysis</a>
        <a href="{{ url_for('budget') }}">Monthly Budget</a>
        <a href="{{ url_for('transactions') }}">Transaction History</a>
    </nav>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="panel">
        <form method="POST" action="{{ url_for('home') }}">
            <div class="form-grid">
                <div>
                    <label for="transaction_type">Transaction Type</label>
                    <select id="transaction_type" name="transaction_type" required>
                        <option value="">Select type</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>

                <div>
                    <label for="category_id">Category</label>
                    <select id="category_id" name="category_id" required>
                        <option value="">Select category</option>
                        {% for c in categories %}
                        <option value="{{ c.category_id }}">{{ c.category_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="amount">Amount (₹)</label>
                    <input id="amount" name="amount" type="number"
                           min="0.01" step="0.01" required>
                </div>

                <div>
                    <label for="transaction_date">Date</label>
                    <input id="transaction_date" name="transaction_date"
                           type="date" max="{{ today }}" value="{{ today }}" required>
                </div>

                <div>
                    <label for="description">Description</label>
                    <input id="description" name="description" type="text"
                           maxlength="255" placeholder="Enter description">
                </div>
            </div>
            <button type="submit">Save Transaction</button>
        </form>
    </div>
</div>
</body>
</html>
